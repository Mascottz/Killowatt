name: ci

on:
  push:
  pull_request:

jobs:
  core:
    name: rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - working-directory: core
        run: cargo test
      - working-directory: core
        run: cargo run -q -- sim > /dev/null
      - working-directory: core
        run: cargo run -q -- ingest ../metering/sample-bill.jsonl > /dev/null

  watcher:
    name: elixir watcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18.3"
      - working-directory: watcher
        run: mix test

  policies:
    name: cue policies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install cue
        run: |
          curl -fsSL https://github.com/cue-lang/cue/releases/download/v0.17.1/cue_v0.17.1_linux_amd64.tar.gz \
            | tar xz -C /usr/local/bin cue
          cue version
      - run: cue vet ./policies/...
      - name: registry is never stale
        run: |
          cue export ./policies -o /tmp/accounts.json
          diff /tmp/accounts.json policies/accounts.json
          cue export ./policies -e acme -o /tmp/acme.json
          diff /tmp/acme.json policies/acme.json

  scorer:
    name: julia scorer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"
      - run: julia scorer/runtests.jl
      - name: the scorer flags the sample bill's planted loop
        run: |
          julia scorer/score.jl metering/sample-bill.jsonl > /tmp/scored.jsonl
          grep -q '"flag": "anomaly"' /tmp/scored.jsonl
